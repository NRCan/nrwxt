layout_twocol_section_nrcan:
  label: 'NRCan two column faceted search'
  path: layouts
  template: layout--twocol-section-nrcan
  library: layout_builder/twocol_section
  class: '\Drupal\layout_builder\Plugin\Layout\TwoColumnLayout'
  category: 'Columns: 2'
  default_region: first
  icon_map:
    - [first, second]
  regions:
    first:
      label: First
    second:
      label: Second
