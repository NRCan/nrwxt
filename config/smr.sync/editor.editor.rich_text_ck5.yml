    - filter.format.rich_text_ck5
  module:
    - ckeditor5
format: rich_text_ck5
editor: ckeditor5
settings:
  toolbar:
    items:
      - undo
      - redo
      - heading
      - style
      - codeBlock
      - bold
      - italic
      - removeFormat
      - '|'
      - alignment
      - indent
      - outdent
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - '-'
      - blockQuote
      - drupalMedia
      - drupalInsertImage
      - node
      - '|'
      - sourceEditing
      - findAndReplace
      - bookmark
      - insertTemplate
      - alert
      - panel
      - Fullscreen
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_codeBlock:
      languages:
        -
          label: 'Plain text'
          language: plaintext
        -
          label: C
          language: c
        -
          label: 'C#'
          language: cs
        -
          label: C++
          language: cpp
        -
          label: CSS
          language: css
        -
          label: Diff
          language: diff
        -
          label: HTML
          language: html
        -
          label: Java
          language: java
        -
          label: JavaScript
          language: javascript
        -
          label: PHP
          language: php
        -
          label: Python
          language: python
        -
          label: Ruby
          language: ruby
        -
          label: TypeScript
          language: typescript
        -
          label: XML
          language: xml
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_imageResize:
      allow_resize: true
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_paste_filter_pasteFilter:
      enabled: false
      filters:
        -
          enabled: true
          weight: -10
          search: '<o:p><\/o:p>'
          replace: ''
        -
          enabled: true
          weight: -9
          search: '(<[^>]*) (style="[^"]*")'
          replace: $1
        -
          enabled: true
          weight: -8
          search: '(<[^>]*) (face="[^"]*")'
          replace: $1
        -
          enabled: true
          weight: -7
          search: '(<[^>]*) (class="[^"]*")'
          replace: $1
        -
          enabled: true
          weight: -6
          search: '(<[^>]*) (valign="[^"]*")'
          replace: $1
        -
          enabled: true
          weight: -5
          search: '<font[^>]*>'
          replace: ''
        -
          enabled: true
          weight: -4
          search: '<\/font>'
          replace: ''
        -
          enabled: true
          weight: -3
          search: '<span[^>]*>'
          replace: ''
        -
          enabled: true
          weight: -2
          search: '<\/span>'
          replace: ''
        -
          enabled: true
          weight: -1
          search: '<p>&nbsp;<\/p>'
          replace: ''
        -
          enabled: true
          weight: 0
          search: '<p><\/p>'
          replace: ''
        -
          enabled: true
          weight: 1
          search: '<b><\/b>'
          replace: ''
        -
          enabled: true
          weight: 2
          search: '<i><\/i>'
          replace: ''
        -
          enabled: true
          weight: 3
          search: '<a name="OLE_LINK[^"]*">(.*?)<\/a>'
          replace: $1
    ckeditor5_plugin_pack_find_and_replace__find_and_replace:
      ui_type: dialog
    ckeditor5_sourceEditing:
      allowed_tags: {  }
    ckeditor5_style:
      styles:
        -
          label: Well
          element: '<div class="well">'
        -
          label: 'Banner - Well if fluid'
          element: '<section class="well">'
        -
          label: 'Link Button - Default'
          element: '<a class="btn btn-default">'
        -
          label: 'Link Button - Primary'
          element: '<a class="btn btn-primary">'
        -
          label: 'Link Button - Call to Action'
          element: '<a class="btn btn-call-to-action">'
        -
          label: 'P Label - Default'
          element: '<p class="label label-default">'
        -
          label: 'P Label - Primary'
          element: '<p class="label label-primary">'
        -
          label: 'P Label - Info'
          element: '<p class="label label-info">'
        -
          label: 'P Label - Success'
          element: '<p class="label label-success">'
        -
          label: 'P Label - Warning'
          element: '<p class="label label-warning">'
        -
          label: 'P Label - Danger'
          element: '<p class="label label-danger">'
        -
          label: 'NEW Circle ordered list'
          element: '<ol class="lst-stps">'
        -
          label: 'List group'
          element: '<ul class="list-group">'
        -
          label: 'List group item'
          element: '<li class="list-group-item">'
        -
          label: 'h2 Class h3'
          element: '<h2 class="h3">'
        -
          label: 'h2 Class h4'
          element: '<h2 class="h4">'
        -
          label: 'h3 Class h4'
          element: '<h3 class="h4">'
        -
          label: 'h3 Class h5'
          element: '<h3 class="h5">'
    ckeditor_codemirror_source_editing:
      enable: true
      mode: htmlmixed
      options:
        autoCloseBrackets: true
        autoCloseTags: true
        folding: true
        lineNumbers: true
        lineWrapping: true
        matchBrackets: true
        matchTags: true
        searchBottom: true
        styleActiveLine: true
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
    media_media:
      allow_view_mode_override: true
image_upload:
  status: true
  scheme: public
  directory: inline-images
  max_size: null
  max_dimensions:
    width: null
    height: null
